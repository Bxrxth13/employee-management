version: '3.8'

services:
  # ======================================================
  # PostgreSQL Database Service
  # ======================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - employee-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================================================
  # Employee Management Spring Boot REST Application Service
  # ======================================================
  employee-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/employeedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - employee-net

# ======================================================
# Bridge Network & Data Volumes Definition
# ======================================================
networks:
  employee-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
